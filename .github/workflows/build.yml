name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
          - name: Windows
            os: windows-2022
            cmake_extra: -G "Visual Studio 17 2022" -A x64
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
          - name: Linux
            os: ubuntu-22.04
            cmake_extra: ""
            pluginval_zip: pluginval_Linux.zip
            pluginval_bin: pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev xvfb

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/juce-src
            build/_deps/juce-subbuild
            build/_deps/catch2-src
            build/_deps/catch2-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
          P=$(sed -nE 's/^project\(OpenGonio VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "tag=$V cmake=$P"
          [ "$V" = "$P" ] || { echo "::error::tag $GITHUB_REF_NAME does not match project(VERSION $P) in CMakeLists.txt"; exit 1; }

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENGONIO_COPY_PLUGIN=OFF ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: bash
        run: |
          curl -fsSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_zip }}"
          mkdir -p pv && cd pv && unzip -q ../pv.zip
          chmod +x "${{ matrix.pluginval_bin }}" || true

      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/OpenGonio_artefacts/Release/AU/OpenGonio.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          pv/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 120000 --validate build/OpenGonio_artefacts/Release/VST3/OpenGonio.vst3
          pv/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 120000 --validate ~/Library/Audio/Plug-Ins/Components/OpenGonio.component

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pv/pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 120000 --validate build/OpenGonio_artefacts/Release/VST3/OpenGonio.vst3

      - name: pluginval (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pv/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 120000 --validate build/OpenGonio_artefacts/Release/VST3/OpenGonio.vst3

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp -R build/OpenGonio_artefacts/Release/VST3/OpenGonio.vst3 stage/
          if [ -d build/OpenGonio_artefacts/Release/AU/OpenGonio.component ]; then cp -R build/OpenGonio_artefacts/Release/AU/OpenGonio.component stage/; fi
          if [ -d build/OpenGonio_artefacts/Release/LV2/OpenGonio.lv2 ]; then cp -R build/OpenGonio_artefacts/Release/LV2/OpenGonio.lv2 stage/; fi
          ls -R stage | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGonio-${{ matrix.name }}
          path: stage/
          if-no-files-found: error

      # ---- release packaging (tags only) ----
      - name: Package (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTS_P12_BASE64: ${{ secrets.APPLE_CERTS_P12_BASE64 }}
          APPLE_CERTS_PASSWORD: ${{ secrets.APPLE_CERTS_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -z "$APPLE_CERTS_P12_BASE64" ]; then
            echo "::warning::No signing secrets; building an unsigned pkg."
            packaging/macos/build-pkg.sh "$V" stage/OpenGonio.vst3 stage/OpenGonio.component dist
            exit 0
          fi
          # Temporary keychain with the Developer ID Application + Installer identities.
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          echo "$APPLE_CERTS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/certs.p12" -P "$APPLE_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          APP_ID="Developer ID Application: Brady Cole ($APPLE_TEAM_ID)"
          PKG_ID="Developer ID Installer: Brady Cole ($APPLE_TEAM_ID)"
          packaging/macos/build-pkg.sh "$V" stage/OpenGonio.vst3 stage/OpenGonio.component dist --sign-app "$APP_ID" --sign-pkg "$PKG_ID"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          packaging/macos/notarize.sh "dist/OpenGonio-$V-macOS.pkg" "$RUNNER_TEMP/AuthKey.p8" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER_ID"
          security delete-keychain "$KC"
          rm -f "$RUNNER_TEMP/certs.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Package (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          # Git Bash rewrites arguments that start with "/" into Windows paths,
          # which turns Inno Setup's /D switches into garbage. Turn that off.
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          V="${GITHUB_REF_NAME#v}"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$ISCC" ] || choco install innosetup -y --no-progress
          mkdir -p dist docs-pkg
          cp LICENSE docs-pkg/LICENSE.txt
          bash packaging/macos/make-readme-txt.sh "$V" > docs-pkg/README.txt
          cp docs-pkg/LICENSE.txt docs-pkg/README.txt stage/
          "$ISCC" "/DVersion=$V" "/DVst3Dir=$(cygpath -w "$PWD/stage/OpenGonio.vst3")" "/DDocsDir=$(cygpath -w "$PWD/docs-pkg")" "/DOutDir=$(cygpath -w "$PWD/dist")" "$(cygpath -w "$PWD/packaging/windows/opengonio.iss")"
          (cd stage && 7z a "../dist/OpenGonio-$V-Windows-VST3.zip" OpenGonio.vst3 LICENSE.txt README.txt)

      - name: Package (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp packaging/linux/install.sh stage/
          cp LICENSE stage/LICENSE.txt
          bash packaging/macos/make-readme-txt.sh "$V" > stage/README.txt
          tar -C stage -czf "dist/OpenGonio-$V-Linux.tar.gz" .

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            echo "## OpenGonio $V"
            echo
            echo "Free, open-source goniometer, Lissajous / vectorscope and stereo field meter for Audacity and any VST3, AU or LV2 host."
            echo
            echo "**These builds are not code-signed.** macOS: right-click the .pkg and choose Open, or use System Settings → Privacy & Security → Open Anyway. Windows: SmartScreen → More info → Run anyway. Linux builds are untested by the author. Full install notes are in the [README](https://github.com/brady1408/opengonio#install)."
          } > notes.md
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
